name: Validar skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências de validação
        run: python3 -m pip install -r requirements-dev.txt
      - name: Testar regressões dos validadores e runtime agentic
        run: python3 -B -m unittest discover -s tests -v
      - name: Verificar estrutura, orçamento e casos de avaliação
        run: python3 scripts/validate_repo.py
      - name: Checar exemplos por dados sensíveis
        run: python3 scripts/check_sensitive_examples.py
      - name: Verificar sistema agentic completo
        run: python3 scripts/validate_agentic.py
      - name: Executar portão de qualidade do próprio repositório
        run: python3 scripts/quality_gate.py --config quality-gate.repo.json --execute
      - name: Verificar harness A/B inicial
        run: |
          python3 scripts/prepare_ab_eval.py --out "$RUNNER_TEMP/verificar-ab"
          python3 - <<'PY'
          import csv, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'verificar-ab'
          with (root / 'operator.csv').open(encoding='utf-8', newline='') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 24, len(rows)
          assert {row['condition'] for row in rows} == {'baseline', 'with_skill'}
          assert (root / 'evaluator.csv').is_file()
          print('A/B manifest: 24 execuções (4 casos x 3 repetições x 2 braços).')
          PY
      - name: Provar isolamento do runner com Codex fake
        run: python3 evals/ab/test_runner.py
