name: Executar fixtures de avaliação

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java-spring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Rodar fixture Java/Spring
        run: bash evals/fixtures/java-spring/run.sh

  libgdx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Rodar fixture LibGDX
        run: bash evals/fixtures/libgdx/run.sh
