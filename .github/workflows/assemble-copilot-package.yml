name: Assemble Copilot package

on:
  push:
    branches:
      - dist/copilot365-agentic-engineering-v3.2
    paths:
      - 'dist/copilot365-agentic-engineering/package-parts/**'
      - '.github/workflows/assemble-copilot-package.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dist/copilot365-agentic-engineering-v3.2

      - name: Assemble and verify ZIP
        shell: bash
        run: |
          cat dist/copilot365-agentic-engineering/package-parts/part-* > /tmp/package.b64
          base64 -d /tmp/package.b64 > dist/copilot365-agentic-engineering/verificar-mudancas-copilot365-agentic-engineering-v3.2.zip
          echo "5ab2d5a1ace6d31eb09e40bd220ca8871f3e6595efbd68578bb04bdb39073dca  dist/copilot365-agentic-engineering/verificar-mudancas-copilot365-agentic-engineering-v3.2.zip" | sha256sum -c -

      - name: Commit final package
        shell: bash
        run: |
          rm -rf dist/copilot365-agentic-engineering/package-parts
          rm -f dist/copilot365-agentic-engineering/UPLOAD-NOTE.txt
          rm -f .github/workflows/assemble-copilot-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "dist: add Copilot 365 Agentic Engineering v3.2 package"
          git push origin HEAD:dist/copilot365-agentic-engineering-v3.2
